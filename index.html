<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>島嶼陀螺戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#E8EFEB; --ink:#112A33; --muted:#4F6D77; --panel:#F6FAF8; --line:#C3D3CE; --tile:#FFFFFF;
  --gold:#E8A917; --verm:#E0472B;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0B1A20; --ink:#E6F0EC; --muted:#8FAAB2; --panel:#122730; --line:#244650; --tile:#10242C;}
}
:root[data-theme="dark"]{--bg:#0B1A20; --ink:#E6F0EC; --muted:#8FAAB2; --panel:#122730; --line:#244650; --tile:#10242C;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,canvas:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- pick screen ---------- */
#pick{max-width:900px;margin:0 auto;padding:28px 18px 0}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(40px,9vw,68px);line-height:1.05;margin:8px 0 10px;letter-spacing:.04em}
.lede{margin:0 0 22px;color:var(--muted);max-width:30em}
.diff{display:flex;gap:0;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.diff span{margin-right:12px;color:var(--muted);font-size:14px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:6px 16px;font-size:14px}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.region{margin-top:22px}
.region h2{font-size:15px;font-weight:700;margin:0 0 8px;display:flex;align-items:center;gap:8px}
.region h2 i{width:10px;height:10px;border-radius:50%;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.tile{background:var(--tile);border:1.5px solid var(--line);border-radius:10px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tile svg{width:58px;height:58px;display:block;overflow:visible}
.tile b{font-weight:500;font-size:13px}
.tile[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
.tile:hover{border-color:var(--muted)}
#dock{position:sticky;bottom:0;margin:28px -18px 0;background:var(--panel);border-top:1.5px solid var(--ink);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
#dock .pv{width:76px;height:76px;display:grid;place-items:center}
#dock .pv svg{width:72px;height:72px;overflow:visible;animation:spin 3.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#dock h3{margin:0;font-family:var(--serif);font-weight:900;font-size:24px;line-height:1.2}
#dock p{margin:0 0 6px;font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;max-width:300px}
.stat{display:flex;align-items:center;gap:6px;font-size:12px}
.stat em{font-style:normal;width:2em;color:var(--muted)}
.pips{display:flex;gap:3px}
.pips u{width:14px;height:7px;border-radius:2px;background:var(--line);text-decoration:none}
.pips u.on{background:var(--ink)}
.go{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:14px 26px;font-weight:700;font-size:17px}
.go:disabled{opacity:.35;cursor:not-allowed}
@media (max-width:560px){
  #dock{grid-template-columns:auto 1fr}
  .go{grid-column:1/-1;width:100%}
}

/* ---------- play screen ---------- */
#play{max-width:700px;margin:0 auto;padding:12px 12px 16px}
#hud{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end;margin-bottom:8px}
.side b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side.r{text-align:right}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;width:100%;border-radius:5px;transition:width .12s linear}
.side.p b{color:var(--gold)} .side.p .bar i{background:var(--gold)}
.side.b b{color:var(--verm)} .side.b .bar i{background:var(--verm);margin-left:auto}
:root:not([data-theme="dark"]) .side.p b{color:#A97500}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .side.p b{color:var(--gold)}}
.score{text-align:center;font-family:var(--serif);font-weight:900;font-size:28px;line-height:1}
.score small{display:block;font-family:var(--sans);font-weight:400;font-size:11px;color:var(--muted);margin-top:3px}
#stage{position:relative;width:min(100%,calc(100vh - 215px),640px);width:min(100%,calc(100dvh - 215px),640px);aspect-ratio:1;margin:0 auto;min-width:240px}
canvas{display:block;width:100%;height:100%;touch-action:none;border-radius:50%;cursor:crosshair}
#banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center;font-family:var(--serif);font-weight:900;font-size:clamp(34px,10vw,76px);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 24px rgba(0,0,0,.5);padding:0 12%;line-height:1.15}
#banner span{display:block}
#banner small{display:block;font-family:var(--sans);font-weight:500;font-size:clamp(14px,3.6vw,22px);margin-top:6px}
#banner.pop span{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(1.5);opacity:0}to{transform:scale(1);opacity:1}}
#over{position:absolute;inset:0;display:grid;place-items:center;border-radius:50%;background:rgba(8,20,26,.78);text-align:center;color:#fff;padding:10%}
#over h2{font-family:var(--serif);font-weight:900;font-size:clamp(36px,10vw,64px);margin:0;line-height:1.1}
#over p{margin:6px 0 16px;opacity:.85}
#over .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#over button{border:0;border-radius:10px;padding:11px 20px;font-weight:700;background:#fff;color:#112A33}
#over button.alt{background:transparent;color:#fff;border:1.5px solid #fff}
#ctrl{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:10px}
.ghost{background:transparent;border:1.5px solid var(--ink);border-radius:10px;padding:10px 16px;font-size:14px}
#dashBtn,#skillBtn{position:relative;flex:1;min-width:0;max-width:260px;border:0;border-radius:10px;padding:14px 8px;font-weight:700;font-size:16px;white-space:nowrap;background:var(--gold);color:#241800;overflow:hidden;touch-action:manipulation}
#dashBtn::after,#skillBtn::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.38);transform-origin:right;transform:scaleX(var(--cd,0));pointer-events:none}
#dashBtn span,#skillBtn span{position:relative;z-index:1}
#skillBtn{background:var(--ink);color:var(--bg)}
.hp{font-size:11px;color:var(--muted);margin-top:2px}
.side.r .hp{text-align:right}
#dock p.skill{color:var(--ink);font-weight:500;margin-bottom:8px}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:10px 0 0}
@media (prefers-reduced-motion:reduce){
  #dock .pv svg{animation:none}
  #banner.pop span{animation:none}
}
</style>
</head>
<body>

<main id="pick">
  <h1>島嶼陀螺戰</h1>
  <p class="lede">挑一個縣市的形狀當你的陀螺，在圓形擂台中間和電腦對轉。把對方撞出去，或把血量打到歸零就贏；每個縣市還有自己的特色技能。</p>
  <div class="diff"><span>對手強度</span>
    <div class="seg" id="diffSeg">
      <button data-d="easy" aria-pressed="false">簡單</button>
      <button data-d="normal" aria-pressed="true">普通</button>
      <button data-d="hard" aria-pressed="false">困難</button>
    </div>
  </div>
  <div id="regions"></div>
  <div id="dock">
    <div class="pv" id="pv"></div>
    <div>
      <h3 id="dName">先選一個縣市</h3>
      <p id="dTrait">點上面的形狀，看看它的特性。</p>
      <p class="skill" id="dSkill"></p>
      <div class="stats" id="dStats"></div>
    </div>
    <button class="go" id="goBtn" disabled>開戰</button>
  </div>
</main>

<main id="play" hidden>
  <div id="hud">
    <div class="side p"><b id="pName"></b><div class="bar"><i id="pBar"></i></div><div class="hp" id="pHp"></div></div>
    <div class="score"><span id="score">0 : 0</span><small id="roundTxt">第 1 局</small></div>
    <div class="side b r"><b id="bName"></b><div class="bar"><i id="bBar"></i></div><div class="hp" id="bHp"></div></div>
  </div>
  <div id="stage">
    <canvas id="cv" tabindex="0" aria-label="陀螺擂台"></canvas>
    <div id="banner"></div>
    <div id="over" hidden>
      <div>
        <h2 id="overT"></h2>
        <p id="overS"></p>
        <div class="row"><button id="again">再戰一次</button><button class="alt" id="back2">換陀螺</button></div>
      </div>
    </div>
  </div>
  <div id="ctrl">
    <button class="ghost" id="backBtn">換陀螺</button>
    <button id="dashBtn"><span>衝刺</span></button>
    <button id="skillBtn"><span>技能</span></button>
  </div>
  <p class="hint">電腦：陀螺會朝滑鼠指的位置移動；點擊或按空白鍵衝刺，按 E（或滑鼠右鍵）發動技能。手機：手指在擂台上拖曳移動，點一下衝刺，按「技能」按鈕放招。擂台中央最低，陀螺會被吸向中心；被撞出擂台或血量歸零就輸，先贏 2 局獲勝。</p>
</main>

/* ================= pick screen ================= */
const $ = s=>document.querySelector(s);
let sel = null, diff = 'normal';
const STAT_LABEL = ['攻擊','防禦','持久','速度'];

function svgOf(s, size){
  const b = s.b + 4;
  return `<svg viewBox="${-b} ${-b} ${2*b} ${2*b}" aria-hidden="true"><path d="${s.path}" fill="${s.color}" stroke="var(--ink)" stroke-width="${b/22}" stroke-linejoin="round"/></svg>`;
}
function buildPick(){
  const box = $('#regions');
  REGIONS.forEach(r=>{
    const sec = document.createElement('section');
    sec.className = 'region';
    sec.innerHTML = `<h2><i style="background:${r.c}"></i>${r.n}</h2><div class="grid"></div>`;
    const g = sec.querySelector('.grid');
    r.l.forEach(n=>{
      const s = byName[n];
      const btn = document.createElement('button');
      btn.className = 'tile'; btn.type='button'; btn.setAttribute('aria-pressed','false'); btn.dataset.n = n;
      btn.innerHTML = svgOf(s) + `<b>${n}</b>`;
      btn.addEventListener('click', ()=>choose(n));
      g.appendChild(btn);
    });
    box.appendChild(sec);
  });
}
function pips(v){ return `<span class="pips">${[1,2,3,4,5].map(i=>`<u class="${i<=v?'on':''}"></u>`).join('')}</span>`; }
function choose(n){
  sel = byName[n];
  document.querySelectorAll('.tile').forEach(t=>t.setAttribute('aria-pressed', t.dataset.n===n?'true':'false'));
  $('#pv').innerHTML = svgOf(sel);
  $('#dName').textContent = sel.name;
  $('#dTrait').textContent = sel.trait;
  $('#dSkill').textContent = `技能：${sel.skill.e} ${sel.skill.n}，${sel.skill.d}`;
  $('#dStats').innerHTML = sel.st.map((v,i)=>`<div class="stat"><em>${STAT_LABEL[i]}</em>${pips(v)}</div>`).join('');
  $('#goBtn').disabled = false;
}
$('#diffSeg').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  diff = b.dataset.d;
  document.querySelectorAll('#diffSeg button').forEach(x=>x.setAttribute('aria-pressed', x===b?'true':'false'));
});

    spin:MAXHP, rot:Math.random()*6.28,
    cd:0, dash:0, hitT:0, fall:0, skillCd:0, haste:0, shield:0, slow:0,
    out:false, stopped:false, trail:[], seed:Math.random()*10
  };
}
function startMatch(){
  const others = SHAPES.filter(s=>s!==sel);
  const botSh = others[Math.floor(Math.random()*others.length)];
  G = {
    tops:[makeTop(sel,0), makeTop(botSh,1)],
    parts:[], proj:[], strikes:[], rings:[], texts:[], shake:0, time:0, phase:'count', timer:3.2, round:1, score:[0,0], bannerKey:''
  };
  $('#pName').textContent = '你 · ' + sel.name;
  $('#bName').textContent = '電腦 · ' + botSh.name;
  $('#over').hidden = true;
  $('#skillBtn span').textContent = sel.skill.e+' '+sel.skill.n;
  startRound();
}
function startRound(){
  const [p,b] = G.tops;
  [p,b].forEach((t,i)=>{
    t.pos = {x: i? 72:-72, y:0}; t.vel={x:0,y:0};
    t.spin=MAXHP; t.cd=0; t.dash=0; t.hitT=0; t.fall=0; t.out=false; t.stopped=false; t.trail=[];
    t.skillCd=2.5; t.haste=0; t.shield=0; t.slow=0;
  });
  G.parts.length = 0; G.proj=[]; G.strikes=[]; G.rings=[]; G.texts=[];
  G.phase='count'; G.timer=3.2;
  $('#score').textContent = G.score[0]+' : '+G.score[1];
  $('#roundTxt').textContent = '第 '+G.round+' 局';
}
function banner(key, html){
  if(G.bannerKey===key) return;
  G.bannerKey = key;
  const el = $('#banner');
  el.innerHTML = html ? `<div><span>${html[0]}</span>${html[1]?`<small>${html[1]}</small>`:''}</div>` : '';
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
}

/* ---- input ---- */
function toLogical(e){
  const r = cv.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width*W - C, y:(e.clientY-r.top)/r.height*W - C};
}
cv.addEventListener('pointerdown', e=>{
  const q = toLogical(e); ptr.x=q.x; ptr.y=q.y; ptr.active=true; wantDash=true;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  e.preventDefault();
});
window.addEventListener('pointermove', e=>{ const q=toLogical(e); ptr.x=q.x; ptr.y=q.y; if(e.pointerType==='mouse') ptr.active=true; });
cv.addEventListener('pointerup', e=>{ if(e.pointerType!=='mouse') ptr.active=false; });
cv.addEventListener('pointercancel', ()=>{ ptr.active=false; });
window.addEventListener('keydown', e=>{
  if($('#play').hidden) return;
  const k = e.key.toLowerCase();
  if(k===' '){ wantDash=true; e.preventDefault(); return; }
  if(k==='e'||k==='q'){ wantSkill=true; e.preventDefault(); return; }
});
$('#dashBtn').addEventListener('pointerdown', e=>{ wantDash=true; e.preventDefault(); });
$('#skillBtn').addEventListener('pointerdown', e=>{ wantSkill=true; e.preventDefault(); });
cv.addEventListener('contextmenu', e=>{ e.preventDefault(); wantSkill=true; });

function playerInput(p){
  let x=0,y=0,m=0;
  if(ptr.active){
    const dx=ptr.x-p.pos.x, dy=ptr.y-p.pos.y, d=Math.hypot(dx,dy);
    if(d>6){ x=dx/d; y=dy/d; m=Math.min(1,d/60); }
  }
  return {x,y,m,acc:1,dash:wantDash,skill:wantSkill};
}
function botInput(b,p,dt){
  const D = DIFF[diff];
  const r = Math.hypot(b.pos.x,b.pos.y);
  const px = p.pos.x + p.vel.x*D.lead, py = p.pos.y + p.vel.y*D.lead;
  const dist = Math.hypot(px-b.pos.x, py-b.pos.y);
  let tx=px, ty=py;
  const pr = Math.hypot(p.pos.x,p.pos.y);
  if(D.smart>0 && pr>40 && dist>95){
    const off = b.hitR + p.hitR + 12;
    tx = px + (-p.pos.x/pr*off - 0)*D.smart;
    ty = py + (-p.pos.y/pr*off)*D.smart;
  }
  let retreat = false;
  const outward = b.pos.x*b.vel.x + b.pos.y*b.vel.y > 0;
  if(r>R*0.70 && (outward || r>R*0.84)){ tx=0; ty=0; retreat=true; }
  const ang = Math.atan2(ty-b.pos.y, tx-b.pos.x) + Math.sin(G.time*1.9+b.seed)*D.noise*0.55;
  let dash=false;
  if(b.cd<=0 && !b.stopped){
    if(retreat && r>R*0.86) dash=true;
    else if(dist<175 && dist>55 && Math.random() < D.dash*dt) dash=true;
  }
  let skill=false;
  if(b.skillCd<=0 && !b.stopped){
    const k=b.sh.skill;
    let ok=false;
    if(k.k==='shoot') ok = dist>90 && dist<440;
    else if(k.k==='nova') ok = dist<k.rad-30;
    else if(k.k==='strike') ok = dist<460;
    else if(k.k==='charge') ok = dist>120 && dist<380;
    else if(k.k==='slow') ok = dist<360;
    else if(k.k==='buff') ok = k.heal&&!k.haste ? b.spin<MAXHP*.68 : (k.heal ? b.spin<MAXHP*.75 : (k.shield ? dist<210 : dist>170));
    if(ok && Math.random() < 1.5*D.dash*dt*(k.heal&&b.spin<MAXHP*.5?3:1)) skill=true;
  }
  return {x:Math.cos(ang), y:Math.sin(ang), m:1, acc:D.acc, dash, skill};
}

/* ---- physics ---- */
function spark(x,y,col,n,sp){
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283, v=sp*(0.3+Math.random());
    G.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.35+Math.random()*.3,c:col});
  }
}
function dmgMul(t){ return t.shield>0 ? 0.4 : 1; }
function floatText(x,y,txt,col){ G.texts.push({x,y,txt,col,l:1.2}); }
function addRing(x,y,max,col,l){ G.rings.push({x,y,max,col,l,lMax:l}); }
function stepTop(t, inp, dt, fight){
  if(t.out){
    t.pos.x += t.vel.x*dt; t.pos.y += t.vel.y*dt;
    t.vel.x *= Math.exp(-1.2*dt); t.vel.y *= Math.exp(-1.2*dt);
    t.fall = Math.min(1, t.fall + dt*1.4);
    return;
  }
  const canMove = !t.stopped && fight;
  const eff = 0.55 + 0.45*Math.max(0,t.spin)/MAXHP;
  if(t.cd>0) t.cd-=dt;
  if(t.dash>0) t.dash-=dt;
  if(t.hitT>0) t.hitT-=dt;
  if(t.skillCd>0) t.skillCd-=dt;
  if(t.haste>0) t.haste-=dt;
  if(t.shield>0) t.shield-=dt;
  if(t.slow>0){ t.slow-=dt; if(Math.random()<0.25) spark(t.pos.x+(Math.random()-.5)*40,t.pos.y-20,'#6FB4FF',1,40); }
  let ax=0, ay=0;
  if(canMove){
    const mult = (t.haste>0?1.5:1)*(t.slow>0?0.5:1);
    const acc = (480 + 120*t.sh.st[3])*eff*(inp.acc||1)*mult;
    ax = inp.x*inp.m*acc; ay = inp.y*inp.m*acc;
    if(inp.dash && t.cd<=0){
      let dx=inp.x, dy=inp.y;
      if(inp.m<=0.01){
        const sp=Math.hypot(t.vel.x,t.vel.y);
        if(sp>30){ dx=t.vel.x/sp; dy=t.vel.y/sp; }
        else { const o=G.tops[1-t.side]; const d=Math.hypot(o.pos.x-t.pos.x,o.pos.y-t.pos.y)||1; dx=(o.pos.x-t.pos.x)/d; dy=(o.pos.y-t.pos.y)/d; }
      }
      const power = 300 + 35*t.sh.st[3];
      t.vel.x += dx*power; t.vel.y += dy*power;
      t.dash = .45; t.cd = 2.2;
      spark(t.pos.x,t.pos.y,'#fff',8,160);
    }
    if(inp.skill && t.skillCd<=0) cast(t);
  }
  { const r=Math.hypot(t.pos.x,t.pos.y), k=1.1+r/400; ax -= t.pos.x*k; ay -= t.pos.y*k; }
  t.vel.x += ax*dt; t.vel.y += ay*dt;
  const f = Math.exp(-(t.slow>0?3.0:2.0)*dt); t.vel.x*=f; t.vel.y*=f;
  t.pos.x += t.vel.x*dt; t.pos.y += t.vel.y*dt;
  const spd = Math.hypot(t.vel.x,t.vel.y);
  if(fight && !t.stopped){
    t.spin -= (2.6 - 0.32*t.sh.st[2] + spd*0.0015)*DMG*dt;
    if(t.spin<=0){ t.spin=0; t.stopped=true; }
  } else if(t.stopped){ t.spin = 0; }
  if(spd>140){ t.trail.push({x:t.pos.x,y:t.pos.y}); if(t.trail.length>14) t.trail.shift(); }
  else if(t.trail.length) t.trail.shift();
}

/* ---- county skills ---- */
function cast(t){
  const k=t.sh.skill, o=G.tops[1-t.side];
  t.skillCd = k.cd;
  floatText(t.pos.x, t.pos.y-t.hitR-14, k.e+' '+k.n, t.side?COL.bot:COL.player);
  const lead=0.22;
  const aim=Math.atan2(o.pos.y+o.vel.y*lead-t.pos.y, o.pos.x+o.vel.x*lead-t.pos.x);
  if(k.k==='shoot'){
    for(let i=0;i<k.cnt;i++){
      let a;
      if(k.spread>=360) a=aim+i*Math.PI*2/k.cnt;
      else a=aim+(k.cnt>1?(i/(k.cnt-1)-.5)*k.spread*Math.PI/180:0);
      G.proj.push({x:t.pos.x+Math.cos(a)*t.hitR, y:t.pos.y+Math.sin(a)*t.hitR, vx:Math.cos(a)*k.spd, vy:Math.sin(a)*k.spd, life:k.life, side:t.side, s:k});
    }
    spark(t.pos.x,t.pos.y,'#fff',6,140);
  } else if(k.k==='nova'){
    addRing(t.pos.x,t.pos.y,k.rad,'#fff',.4);
    const dx=o.pos.x-t.pos.x, dy=o.pos.y-t.pos.y, d=Math.hypot(dx,dy)||1;
    if(!o.out && d<k.rad+o.hitR){
      const fall=1-0.45*d/k.rad;
      o.vel.x+=dx/d*k.knock*fall/o.mass; o.vel.y+=dy/d*k.knock*fall/o.mass;
      o.spin=Math.max(0,o.spin-k.dmg*DMG*dmgMul(o));
      spark(o.pos.x,o.pos.y,'#fff',14,260); G.shake=Math.max(G.shake,6);
    }
  } else if(k.k==='strike'){
    G.strikes.push({x:o.pos.x+o.vel.x*.3, y:o.pos.y+o.vel.y*.3, t:k.delay, s:k, side:t.side});
  } else if(k.k==='buff'){
    if(k.heal){ t.spin=Math.min(MAXHP,t.spin+k.heal); spark(t.pos.x,t.pos.y,'#7CF29C',14,150); }
    if(k.haste) t.haste=k.haste;
    if(k.shield) t.shield=k.shield;
  } else if(k.k==='slow'){
    o.slow=Math.max(o.slow,k.dur);
    addRing(o.pos.x,o.pos.y,70,'#6FB4FF',.5);
  } else if(k.k==='charge'){
    const dx=Math.cos(aim), dy=Math.sin(aim);
    t.vel.x+=dx*760; t.vel.y+=dy*760; t.dash=.75;
    spark(t.pos.x,t.pos.y,'#fff',12,200);
  }
}
function hitByProj(p,o){
  const k=p.s, owner=G.tops[p.side];
  const dmg = k.dmg*(0.7+0.1*owner.sh.st[0])/(0.8+0.1*o.sh.st[1])*dmgMul(o)*(owner.dash>0?1.2:1);
  o.spin=Math.max(0,o.spin-dmg*DMG);
  const sp=Math.hypot(p.vx,p.vy)||1;
  o.vel.x+=p.vx/sp*k.knock/o.mass; o.vel.y+=p.vy/sp*k.knock/o.mass;
  if(k.slow) o.slow=Math.max(o.slow,k.slow);
  spark(p.x,p.y,'#FFE9A8',8,200);
  G.shake=Math.max(G.shake,Math.min(7,k.knock/90));
}
function tickFx(dt){
  G.rings.forEach(r=>r.l-=dt); G.rings=G.rings.filter(r=>r.l>0);
  G.texts.forEach(q=>{q.l-=dt;q.y-=28*dt;}); G.texts=G.texts.filter(q=>q.l>0);
}
function updateAux(dt){
  const next=[];
  G.proj.forEach(p=>{
    const o=G.tops[1-p.side];
    if(p.s.homing && !o.out){
      const sp=Math.hypot(p.vx,p.vy);
      const cur=Math.atan2(p.vy,p.vx), want=Math.atan2(o.pos.y-p.y,o.pos.x-p.x);
      let da=want-cur; while(da>Math.PI)da-=6.283; while(da<-Math.PI)da+=6.283;
      const na=cur+Math.max(-p.s.homing*dt,Math.min(p.s.homing*dt,da));
      p.vx=Math.cos(na)*sp; p.vy=Math.sin(na)*sp;
    }
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt;
    if(p.life<=0 || Math.hypot(p.x,p.y)>R+20) return;
    if(!o.out && Math.hypot(p.x-o.pos.x,p.y-o.pos.y) < o.hitR+p.s.size){ hitByProj(p,o); return; }
    next.push(p);
  });
  G.proj=next;
  const rest=[];
  G.strikes.forEach(s=>{
    s.t-=dt;
    if(s.t>0){ rest.push(s); return; }
    addRing(s.x,s.y,s.s.rad,'#FFB347',.4);
    spark(s.x,s.y,'#FFB347',16,260); G.shake=Math.max(G.shake,8);
    const o=G.tops[1-s.side];
    const dx=o.pos.x-s.x, dy=o.pos.y-s.y, d=Math.hypot(dx,dy)||1;
    if(!o.out && d<s.s.rad+o.hitR){
      o.spin=Math.max(0,o.spin-s.s.dmg*DMG*dmgMul(o));
      o.vel.x+=dx/d*s.s.knock/o.mass; o.vel.y+=dy/d*s.s.knock/o.mass;
    }
  });
  G.strikes=rest;
}
function collide(a,b,fight){
  if(a.out||b.out) return;
  let dx=b.pos.x-a.pos.x, dy=b.pos.y-a.pos.y, d=Math.hypot(dx,dy);
  const min=a.hitR+b.hitR;
  if(d>=min) return;
  if(d<0.001){ dx=1; dy=0; d=1; }
  const nx=dx/d, ny=dy/d;
  const over=min-d, tm=a.mass+b.mass;
  a.pos.x-=nx*over*b.mass/tm; a.pos.y-=ny*over*b.mass/tm;
  b.pos.x+=nx*over*a.mass/tm; b.pos.y+=ny*over*a.mass/tm;
  const vn=(b.vel.x-a.vel.x)*nx+(b.vel.y-a.vel.y)*ny;
  if(vn<0){
    const j=-(1.95)*vn/(1/a.mass+1/b.mass);
    a.vel.x-=j/a.mass*nx; a.vel.y-=j/a.mass*ny;
    b.vel.x+=j/b.mass*nx; b.vel.y+=j/b.mass*ny;
    const kbA = 40 + 24*a.sh.st[0]*(a.dash>0?1.5:1);
    const kbB = 40 + 24*b.sh.st[0]*(b.dash>0?1.5:1);
    a.vel.x-=nx*kbB; a.vel.y-=ny*kbB;
    b.vel.x+=nx*kbA; b.vel.y+=ny*kbA;
    const ap=-vn;
    if(fight && a.hitT<=0 && b.hitT<=0){
      const base = Math.min(ap*0.022+1.5, 14);
      const dA = base*(0.7+0.3*b.sh.st[0])*(b.dash>0?1.5:1)*dmgMul(a)/(0.6+0.22*a.sh.st[1]);
      const dB = base*(0.7+0.3*a.sh.st[0])*(a.dash>0?1.5:1)*dmgMul(b)/(0.6+0.22*b.sh.st[1]);
      a.spin=Math.max(0,a.spin-dA*DMG); b.spin=Math.max(0,b.spin-dB*DMG);
      a.hitT=b.hitT=.22;
      G.shake=Math.max(G.shake,Math.min(9,ap/45));
      spark(a.pos.x+nx*a.hitR, a.pos.y+ny*a.hitR, '#FFE9A8', 12, 260);
    }
  }
}
function update(dt){
  G.time+=dt;
  const [p,b]=G.tops;
  if(G.shake>0) G.shake=Math.max(0,G.shake-30*dt);
  G.parts.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;q.vx*=.93;q.vy*=.93;});
  G.parts = G.parts.filter(q=>q.l>0);
  tickFx(dt);

  if(G.phase==='count'){
    G.timer-=dt;
    [p,b].forEach(t=>{ t.rot += (2+16*t.spin/MAXHP)*dt*(t.side?-1:1); });
    if(G.timer>0.2){
      const n=Math.ceil(G.timer-0.2);
      banner('c'+n, [String(n), G.round===1&&n===3?'滑鼠指到哪，陀螺就往哪走':'']);
      wantDash=false; wantSkill=false; return;
    }
    banner('go',['開轉！','']);
    G.phase='fight'; G.goT=.7;
  }
  if(G.goT>0){ G.goT-=dt; if(G.goT<=0) banner('none',null); }
  const fight = G.phase==='fight';
  const pin = fight ? playerInput(p) : {x:0,y:0,m:0,dash:false};
  wantDash=false; wantSkill=false;
  const bin = fight ? botInput(b,p,dt) : {x:0,y:0,m:0,dash:false};
  stepTop(p,pin,dt,fight); stepTop(b,bin,dt,fight);
  collide(p,b,fight);
  if(fight) updateAux(dt);
  [p,b].forEach(t=>{ t.rot += (2+16*t.spin/MAXHP)*dt*(t.side?-1:1); });

  if(G.phase==='fight'){
    const lose=[];
    [p,b].forEach(t=>{
      if(!t.out && Math.hypot(t.pos.x,t.pos.y)>R-2){ t.out=true; t.why='ring'; lose.push(t); }
      else if(t.stopped && !t.out){ t.why='spin'; lose.push(t); }
    });
    if(lose.length){
      const loser = lose.length===2 ? (p.spin<=b.spin?p:b) : lose[0];
      const winSide = 1-loser.side;
      G.score[winSide]++;
      G.phase='end'; G.timer=2.3;
      const why = loser.why==='ring' ? (loser.side?'對手被撞出擂台':'你被撞出擂台') : (loser.side?'對手血量歸零':'你的血量歸零');
      banner('end'+G.round, [winSide===0?'你贏了這一局':'對手贏了這一局', why]);
      $('#score').textContent = G.score[0]+' : '+G.score[1];
    }
  } else if(G.phase==='end'){
    G.timer-=dt;
    if(G.timer<=0){
      if(G.score[0]>=2||G.score[1]>=2) finishMatch();
      else { G.round++; banner('none',null); startRound(); }
    }
  }
}
function finishMatch(){
  G.phase='over';
  banner('none',null);
  const win=G.score[0]>G.score[1];
  $('#overT').textContent = win?'你獲勝！':'這次輸了';
  $('#overS').textContent = `比數 ${G.score[0]} : ${G.score[1]}　${sel.name} 對 ${G.tops[1].sh.name}`;
  $('#over').hidden=false;
  $('#again').focus({preventScroll:true});
}

/* ---- render ---- */
function drawArena(){
  ctx.save(); ctx.translate(C,C);
  const circle=(r)=>{ ctx.beginPath(); ctx.arc(0,0,r,0,6.283); ctx.fill(); };
  ctx.fillStyle='#06141A'; circle(R+18);
  ctx.fillStyle='#3E7381'; circle(R+8);
  // bowl floor: darkest at the centre, lighter toward the rim
  const g=ctx.createRadialGradient(0,0,0,0,0,R);
  g.addColorStop(0,'#0A2A34'); g.addColorStop(1,'#245866');
  ctx.fillStyle=g; circle(R);
  // single thin edge line
  ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(0,0,R-10,0,6.283); ctx.stroke();
  // centre dot
  ctx.fillStyle='rgba(190,235,230,.35)'; circle(4);
  ctx.restore();
}
function drawTop(t){
  if(t.fall>=1) return;
  const col = t.side?COL.bot:COL.player;
  // trail
  t.trail.forEach((q,i)=>{
    ctx.globalAlpha = i/t.trail.length*0.25;
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(q.x,q.y,t.hitR*(0.4+0.5*i/t.trail.length),0,6.283); ctx.fill();
  });
  ctx.globalAlpha=1;
  ctx.save();
  if(t.shield>0){ ctx.strokeStyle='#7FE0FF'; ctx.lineWidth=4; ctx.globalAlpha=.8; ctx.beginPath(); ctx.arc(t.pos.x,t.pos.y,t.hitR+10,0,6.283); ctx.stroke(); ctx.globalAlpha=1; }
  if(t.haste>0){ ctx.strokeStyle='#FFD54A'; ctx.lineWidth=3; ctx.setLineDash([6,6]); ctx.beginPath(); ctx.arc(t.pos.x,t.pos.y,t.hitR+7,0,6.283); ctx.stroke(); ctx.setLineDash([]); }
  const low = t.spin<MAXHP*.3 ? 1-t.spin/(MAXHP*.3) : 0;
  const wob = low*Math.sin(G.time*16+t.seed)*3.5;
  const k = 1 - t.fall*0.75;
  ctx.translate(t.pos.x+wob, t.pos.y+wob*0.6);
  ctx.scale(k,k);
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(3,6,t.hitR+3,t.hitR,0,0,6.283); ctx.fill();
  ctx.fillStyle=col; ctx.beginPath(); ctx.arc(0,0,t.hitR+3,0,6.283); ctx.fill();
  ctx.fillStyle='#0E2229'; ctx.beginPath(); ctx.arc(0,0,t.hitR-1,0,6.283); ctx.fill();
  if(t.dash>0){ ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,0,t.hitR+6,0,6.283); ctx.stroke(); }
  ctx.save();
  ctx.rotate(t.rot); ctx.scale(S,S);
  ctx.fillStyle=t.sh.color; ctx.strokeStyle='#fff'; ctx.lineWidth=1.8/S; ctx.lineJoin='round';
  ctx.fill(t.sh.p2d); ctx.stroke(t.sh.p2d);
  ctx.restore();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,3.5,0,6.283); ctx.fill();
  ctx.restore();
}
function drawLabel(t){
  if(t.fall>0.2) return;
  ctx.font='700 14px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  ctx.textAlign='center'; ctx.lineWidth=4; ctx.strokeStyle='rgba(8,20,26,.85)';
  const y = t.pos.y + t.hitR + 20;
  const txt = (t.side?'':'你 ')+t.sh.name;
  ctx.strokeText(txt,t.pos.x,y);
  ctx.fillStyle=t.side?COL.bot:COL.player; ctx.fillText(txt,t.pos.x,y);
}
function drawAux(){
  G.rings.forEach(r=>{
    const f=1-r.l/r.lMax;
    ctx.globalAlpha=Math.max(0,r.l/r.lMax)*.9; ctx.strokeStyle=r.col; ctx.lineWidth=6;
    ctx.beginPath(); ctx.arc(r.x,r.y,r.max*f,0,6.283); ctx.stroke();
  });
  ctx.globalAlpha=1;
  G.strikes.forEach(s=>{
    const f=1-s.t/s.s.delay;
    ctx.globalAlpha=.35+.35*Math.sin(G.time*20);
    ctx.strokeStyle='#FF5A3C'; ctx.fillStyle='rgba(255,90,60,.18)'; ctx.lineWidth=3; ctx.setLineDash([8,6]);
    ctx.beginPath(); ctx.arc(s.x,s.y,s.s.rad,0,6.283); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha=1;
    ctx.font='40px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(s.s.e, s.x, s.y-(1-f)*160);
    ctx.textBaseline='alphabetic';
  });
  G.proj.forEach(p=>{
    ctx.fillStyle=p.side?'rgba(228,87,46,.28)':'rgba(240,180,41,.28)';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.s.size+4,0,6.283); ctx.fill();
    ctx.font=Math.round(p.s.size*2)+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(p.s.e,p.x,p.y+1);
    ctx.textBaseline='alphabetic';
  });
  G.texts.forEach(q=>{
    ctx.globalAlpha=Math.min(1,q.l*2);
    ctx.font='900 17px "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
    ctx.textAlign='center'; ctx.lineWidth=4; ctx.strokeStyle='rgba(8,20,26,.9)';
    ctx.strokeText(q.txt,q.x,q.y); ctx.fillStyle=q.col; ctx.fillText(q.txt,q.x,q.y);
  });
  ctx.globalAlpha=1;
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,W,W);
  ctx.save();
  if(G.shake>0 && !reduceMotion) ctx.translate((Math.random()-.5)*G.shake,(Math.random()-.5)*G.shake);
  drawArena();
  ctx.save(); ctx.translate(C,C);   // everything below uses centre-origin coordinates
  // draw lower-spin first so winner sits on top
  const order=[...G.tops].sort((a,b)=>a.spin-b.spin);
  order.forEach(drawTop);
  G.parts.forEach(q=>{ ctx.globalAlpha=Math.min(1,q.l*3); ctx.fillStyle=q.c; ctx.fillRect(q.x-2,q.y-2,4,4); });
  ctx.globalAlpha=1;
  G.tops.forEach(drawLabel);
  drawAux();
  ctx.restore();
  ctx.restore();
  const [p,b]=G.tops;
  $('#pBar').style.width=(p.spin/MAXHP*100)+'%';
  $('#bBar').style.width=(b.spin/MAXHP*100)+'%';
  $('#pHp').textContent='血量 '+Math.ceil(p.spin)+' / '+MAXHP;
  $('#bHp').textContent='血量 '+Math.ceil(b.spin)+' / '+MAXHP;
  $('#skillBtn').style.setProperty('--cd', (Math.max(0,p.skillCd)/p.sh.skill.cd).toFixed(3));
  const cdFrac = Math.max(0,p.cd)/2.2;
  $('#dashBtn').style.setProperty('--cd', cdFrac.toFixed(3));
}

let last=0, acc=0, running=false;
function loop(ts){
  if(!G || $('#play').hidden){ last=0; running=false; return; }
  if(!last) last=ts;
  let dt=(ts-last)/1000; last=ts;
  dt=Math.min(dt,0.1); acc+=dt;
  const h=1/120;
  while(acc>=h){ update(h); acc-=h; }
  render();
  requestAnimationFrame(loop);
}
function show(which){
  $('#pick').hidden = which!=='pick';
  $('#play').hidden = which!=='play';
  window.scrollTo(0,0);
}
function begin(){
  show('play'); startMatch(); last=0; acc=0; ptr.active=false; wantDash=false;
  if(!running){ running=true; requestAnimationFrame(loop); }
}
$('#goBtn').addEventListener('click', ()=>{ if(sel) begin(); });
$('#again').addEventListener('click', begin);
$('#back2').addEventListener('click', ()=>show('pick'));
$('#backBtn').addEventListener('click', ()=>{ G=null; show('pick'); });
</script>
</body>
